spring.application.name=skillswap

# Banco de dados MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/skillswap?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
# A senha pode ser alterada definindo a variavel de ambiente DB_PASSWORD
spring.datasource.password=${DB_PASSWORD:2304}

# O schema e criado pelo database/schema.sql, aplicado manualmente no MySQL
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

# Faz as mensagens de erro da API chegarem ao front-end
server.error.include-message=always
