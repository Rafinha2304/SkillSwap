<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu perfil | SkillSwap</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="perfil">
    <header class="topbar">
        <a class="brand" href="index.html" aria-label="SkillSwap, página inicial">
            <span class="brand-mark">S</span>
            <span>Skill<span>Swap</span></span>
        </a>
        <nav aria-label="Navegação principal">
            <a href="busca.html">Estudantes</a>
            <a href="solicitacoes.html">Trocas</a>
            <a href="index.html">Início</a>
            <a href="#" id="link-sair">Sair</a>
        </nav>
    </header>

    <main class="auth-shell">
        <section class="auth-card perfil-card" aria-labelledby="perfil-title">
            <div class="perfil-head">
                <span class="perfil-avatar" id="perfil-inicial">?</span>
                <div>
                    <h1 id="perfil-title">Meu perfil</h1>
                    <p><span id="perfil-email"></span><br><small id="perfil-desde"></small></p>
                </div>
            </div>

            <h2 class="perfil-section-title">Minha biografia</h2>
            <p class="perfil-bio" id="perfil-bio"></p>

            <h2 class="perfil-section-title">Posso ensinar</h2>
            <div class="skill-list" id="lista-oferece"></div>

            <h2 class="perfil-section-title">Quero aprender</h2>
            <div class="skill-list" id="lista-deseja"></div>

            <h2 class="perfil-section-title">Adicionar habilidade</h2>
            <form id="form-habilidade" novalidate>
                <datalist id="habilidades-existentes"></datalist>
                <div class="field">
                    <label for="habilidade">Habilidade</label>
                    <input type="text" id="habilidade" name="nome" list="habilidades-existentes" maxlength="100" placeholder="Ex.: Java básico, Canva, conversação em inglês" required>
                </div>
                <div class="form-row">
                    <div class="field">
                        <label for="categoria">Categoria</label>
                        <select id="categoria" name="categoria" required>
                            <option value="">Escolha...</option>
                            <option value="Tecnologia">Tecnologia</option>
                            <option value="Criatividade">Criatividade</option>
                            <option value="Idiomas">Idiomas</option>
                            <option value="Estudos">Estudos</option>
                            <option value="Outros">Outros</option>
                        </select>
                    </div>
                    <div class="field">
                        <label for="tipo">Tipo</label>
                        <select id="tipo" name="tipo" required>
                            <option value="">Escolha...</option>
                            <option value="OFERECE">Posso ensinar</option>
                            <option value="DESEJA_APRENDER">Quero aprender</option>
                        </select>
                    </div>
                </div>
                <div class="auth-actions">
                    <button class="button button-dark" type="submit">Adicionar habilidade</button>
                </div>
            </form>

            <h2 class="perfil-section-title separador">Editar perfil</h2>
            <form id="form-perfil" novalidate>
                <div class="field">
                    <label for="nome">Nome</label>
                    <input type="text" id="nome" name="nome" maxlength="120" required>
                </div>
                <div class="field">
                    <label for="biografia">Biografia</label>
                    <textarea id="biografia" name="biografia" maxlength="500" placeholder="Conte o que você sabe ensinar e o que deseja aprender."></textarea>
                </div>
                <div class="auth-actions">
                    <button class="button button-primary" type="submit">Salvar alterações</button>
                </div>
            </form>
        </section>
    </main>

    <div class="toast" role="status" aria-live="polite"></div>
    <script src="js/sessao.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
