<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%236345db'/%3E%3Ctext x='16' y='23' font-family='Arial,sans-serif' font-size='18' font-weight='bold' fill='white' text-anchor='middle'%3ES%3C/text%3E%3C/svg%3E">
    <title>Entrar | SkillSwap</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="login">
    <header class="topbar">
        <a class="brand" href="index.html" aria-label="SkillSwap, página inicial">
            <span class="brand-mark">S</span>
            <span>Skill<span>Swap</span></span>
        </a>
        <nav aria-label="Navegação principal">
            <a href="index.html">Início</a>
        </nav>
    </header>

    <main class="auth-shell">
        <section class="auth-card" aria-labelledby="login-title">
            <p class="eyebrow">BEM-VINDO DE VOLTA</p>
            <h1 id="login-title">Entrar</h1>
            <p class="auth-sub">Acesse sua conta para encontrar pessoas com quem trocar conhecimento.</p>
            <form id="form-login" novalidate>
                <div class="field">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" name="email" autocomplete="email" placeholder="voce@escola.com" required>
                </div>
                <div class="field">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" name="senha" autocomplete="current-password" placeholder="Sua senha" required>
                </div>
                <div class="auth-actions">
                    <button class="button button-primary button-large" type="submit">Entrar</button>
                </div>
            </form>
            <p class="auth-alt">Ainda não tem conta? <a href="cadastro.html">Cadastre-se</a></p>
        </section>
    </main>

    <div class="toast" role="status" aria-live="polite"></div>
    <script src="js/auth.js"></script>
</body>
</html>
