<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar conta | SkillSwap</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="cadastro">
    <header class="topbar">
        <a class="brand" href="index.html" aria-label="SkillSwap, página inicial">
            <span class="brand-mark">S</span>
            <span>Skill<span>Swap</span></span>
        </a>
        <nav aria-label="Navegação principal">
            <a href="index.html">Início</a>
        </nav>
    </header>

    <main class="auth-shell">
        <section class="auth-card" aria-labelledby="cadastro-title">
            <p class="eyebrow">JUNTE-SE À COMUNIDADE</p>
            <h1 id="cadastro-title">Criar sua conta</h1>
            <p class="auth-sub">Em poucos minutos você estará trocando conhecimento com outros estudantes.</p>
            <form id="form-cadastro" novalidate>
                <div class="field">
                    <label for="nome">Nome</label>
                    <input type="text" id="nome" name="nome" autocomplete="name" maxlength="120" placeholder="Seu nome completo" required>
                </div>
                <div class="field">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" name="email" autocomplete="email" maxlength="150" placeholder="voce@escola.com" required>
                </div>
                <div class="field">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" name="senha" autocomplete="new-password" maxlength="72" placeholder="Mínimo de 6 caracteres" required>
                    <span class="hint">Use pelo menos 6 caracteres.</span>
                </div>
                <div class="field">
                    <label for="biografia">Biografia <span class="hint">(opcional)</span></label>
                    <textarea id="biografia" name="biografia" maxlength="500" placeholder="Conte o que você sabe ensinar e o que deseja aprender."></textarea>
                </div>
                <div class="auth-actions">
                    <button class="button button-primary button-large" type="submit">Criar conta</button>
                </div>
            </form>
            <p class="auth-alt">Já tem conta? <a href="login.html">Entrar</a></p>
        </section>
    </main>

    <div class="toast" role="status" aria-live="polite"></div>
    <script src="js/auth.js"></script>
</body>
</html>
